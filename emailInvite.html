<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light" />
    <title>دعوة رسمية | أرامكو</title>
    <!--[if mso]>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->

    <style>
        @font-face {
            font-family: "DIN Next LT Arabic";
            src: url("assets/fonts/DINNextLTArabic-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "DIN Next LT Arabic Medium";
            src: url("assets/fonts/DINNextLTArabic-Medium.ttf") format("truetype");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        :root {
            color-scheme: light only;
            supported-color-schemes: light;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background: #e8e8e8;
            font-family: "DIN Next LT Arabic", Tahoma, Arial, sans-serif;
            color-scheme: light only;
        }

        table {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            border-collapse: collapse;
            table-layout: fixed;
            background: #ffffff;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        td {
            padding: 0;
            text-align: center;
            vertical-align: top;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            border: 0;
        }

        a {
            display: block;
            text-decoration: none;
        }

        .name-cell,
        #guestName {
            background: #ffffff !important;
            background-color: #ffffff !important;
            background-image: linear-gradient(#ffffff, #ffffff) !important;
            color: #26235A !important;
            -webkit-text-fill-color: #26235A !important;
            font-family: "DIN Next LT Arabic Medium", "DIN Next LT Arabic", Tahoma, Arial, sans-serif !important;
            font-weight: 500 !important;
        }

        .name-cell {
            padding: 0 20px !important;
            font-size: 20px !important;
            font-weight: 500 !important;
            line-height: 24px !important;
            color-scheme: light only;
        }

        #guestName {
            display: inline-block !important;
            width: 100% !important;
        }

        @media (prefers-color-scheme: dark) {

            .name-cell,
            #guestName {
                background: #ffffff !important;
                background-color: #ffffff !important;
                background-image: linear-gradient(#ffffff, #ffffff) !important;
                color: #26235A !important;
                -webkit-text-fill-color: #26235A !important;
            }
        }

        [data-ogsc] .name-cell,
        [data-ogsc] #guestName,
        [data-ogsb] .name-cell,
        [data-ogsb] #guestName {
            background: #ffffff !important;
            background-color: #ffffff !important;
            background-image: linear-gradient(#ffffff, #ffffff) !important;
            color: #26235A !important;
        }

        u+.body .name-cell,
        u+.body #guestName {
            background: #ffffff !important;
            background-color: #ffffff !important;
            color: #26235A !important;
        }

        @media (max-width: 620px) {
            body {
                padding: 0;
            }

            .name-cell {
                padding: 0 14px !important;
                font-size: 18px !important;
            }
        }
    </style>
</head>

<body class="body" style="margin:0; padding:24px 16px; background:#e8e8e8; font-family:'DIN Next LT Arabic', Tahoma, Arial, sans-serif;">
    <table id="invite-card" role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" width="560" style="width:100%; max-width:560px; margin:0 auto; border-collapse:collapse; table-layout:fixed; background-color:#ffffff;">
        <tr>
            <td colspan="2" bgcolor="#ffffff" style="padding:0; background-color:#ffffff; line-height:0; font-size:0;">
                <img src="assets/emailInvitation/emailInvite-v5/email-invite-header.webp" width="560" alt="دعوة أرامكو" style="display:block; width:100%; height:auto; border:0;" />
            </td>
        </tr>
        <tr>
            <td colspan="2" class="name-cell" align="center" valign="middle" bgcolor="#ffffff" style="padding:0 20px; margin:0; background:#ffffff; background-color:#ffffff; background-image:linear-gradient(#ffffff,#ffffff); color:#26235A; font-family:'DIN Next LT Arabic Medium', 'DIN Next LT Arabic', Tahoma, Arial, sans-serif; font-size:20px; font-weight:500; line-height:24px; text-align:center;">
                <!--[if mso]>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#ffffff"><tr><td align="center" bgcolor="#ffffff" style="background-color:#ffffff; color:#26235A; font-family:Tahoma, Arial, sans-serif; font-size:20px; font-weight:700; line-height:24px;">
                <![endif]-->
                <span id="guestName" style="display:inline-block; width:100%; color:#26235A; -webkit-text-fill-color:#26235A; background:#ffffff; background-color:#ffffff; background-image:linear-gradient(#ffffff,#ffffff); font-family:'DIN Next LT Arabic Medium', 'DIN Next LT Arabic', Tahoma, Arial, sans-serif; font-weight:500;">ضيفنا الكريم</span>
                <!--[if mso]>
                </td></tr></table>
                <![endif]-->
            </td>
        </tr>
        <tr>
            <td colspan="2" bgcolor="#ffffff" style="padding:0; background-color:#ffffff; line-height:0; font-size:0;">
                <img src="assets/emailInvitation/emailInvite-v5/email-invite-info.webp" width="560" alt="تفاصيل الحفل" style="display:block; width:100%; height:auto; border:0;" />
            </td>
        </tr>
        <!-- Force LTR on CTA row: page is dir=rtl, and email/browser clients flip table columns inconsistently -->
        <tr>
            <td colspan="2" dir="ltr" bgcolor="#ffffff" style="padding:0; background-color:#ffffff; direction:ltr; text-align:left; line-height:0; font-size:0;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" dir="ltr" width="560" bgcolor="#ffffff" style="width:100%; max-width:560px; border-collapse:collapse; table-layout:fixed; direction:ltr; background-color:#ffffff;">
                    <tr>
                        <td dir="ltr" width="280" bgcolor="#ffffff" style="padding:0; width:50%; background-color:#ffffff; direction:ltr; line-height:0; font-size:0;">
                            <a id="btnDecline" href="/rsvp?status=decline&amp;uniqueId=" style="display:block; text-decoration:none;">
                                <img src="assets/emailInvitation/emailInvite-v5/email-invite-decline.webp" width="280" alt="اعتذار" style="display:block; width:100%; height:auto; border:0;" />
                            </a>
                        </td>
                        <td dir="ltr" width="280" bgcolor="#ffffff" style="padding:0; width:50%; background-color:#ffffff; direction:ltr; line-height:0; font-size:0;">
                            <a id="btnAccept" href="/rsvp?status=accept&amp;uniqueId=" style="display:block; text-decoration:none;">
                                <img src="assets/emailInvitation/emailInvite-v5/email-invite-accept.webp" width="280" alt="تأكيد الحضور" style="display:block; width:100%; height:auto; border:0;" />
                            </a>
                        </td>

                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var name = (params.get("name") || "").trim();
            var uniqueId = (params.get("uniqueId") || "").trim();

            var guestEl = document.getElementById("guestName");
            if (name && guestEl) guestEl.textContent = name;

            var RSVP_BASE = "/rsvp";

            function buildUrl(statusValue) {
                var next = new URLSearchParams();
                if (name) next.set("name", name);
                if (uniqueId) next.set("uniqueId", uniqueId);
                next.set("status", statusValue);
                return RSVP_BASE + "?" + next.toString();
            }

            var accept = document.getElementById("btnAccept");
            var decline = document.getElementById("btnDecline");
            if (accept) accept.href = buildUrl("accept");
            if (decline) decline.href = buildUrl("decline");
        })();
    </script>
</body>

</html>

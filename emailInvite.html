<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light" />
    <title>Official Invitation | Aramco Farewells</title>
    <!--[if mso]>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->

    <style>
        @font-face {
            font-family: "DIN Next LT Arabic";
            src: url("assets/fonts/DINNextLTArabic-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "DIN Next LT Arabic Medium";
            src: url("assets/fonts/DINNextLTArabic-Medium.ttf") format("truetype");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        :root {
            color-scheme: light only;
            supported-color-schemes: light;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background: #e8e8e8;
            font-family: "DIN Next LT Arabic", Tahoma, Arial, sans-serif;
            color-scheme: light only;
        }

        table {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            border-collapse: collapse;
            table-layout: fixed;
            background: #313131;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        td {
            padding: 0;
            text-align: center;
            vertical-align: top;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            border: 0;
        }

        a {
            display: block;
            text-decoration: none;
        }

        .name-cell {
            position: relative !important;
            height: 0 !important;
            padding: 0 0 16.4276% 0 !important;
            background-color: #313131 !important;
            background-image: none !important;
            color-scheme: light only;
        }

        #guestName {
            position: absolute !important;
            left: 70px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            display: block !important;
            width: auto !important;
            margin: 0 !important;
            background: transparent !important;
            background-color: transparent !important;
            background-image: none !important;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            font-family: Arial, Helvetica, sans-serif !important;
            font-size: 30px !important;
            font-weight: 700 !important;
            line-height: 36px !important;
            text-align: left !important;
        }

        .rsvp-btn {
            display: inline-block;
            background: #0AAEED;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: 700;
            line-height: 20px;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 6px;
        }

        @media (prefers-color-scheme: dark) {

            .name-cell {
                background-color: #313131 !important;
                color: #ffffff !important;
                -webkit-text-fill-color: #ffffff !important;
            }

            #guestName {
                background: transparent !important;
                background-color: transparent !important;
                color: #ffffff !important;
                -webkit-text-fill-color: #ffffff !important;
            }
        }

        [data-ogsc] .name-cell,
        [data-ogsb] .name-cell {
            background-color: #313131 !important;
            color: #ffffff !important;
        }

        [data-ogsc] #guestName,
        [data-ogsb] #guestName {
            background-color: transparent !important;
            color: #ffffff !important;
        }

        @media (max-width: 620px) {
            body {
                padding: 0;
            }

            #guestName {
                left: 40px !important;
                font-size: 24px !important;
            }
        }
    </style>
</head>

<body class="body" style="margin:0; padding:24px 16px; background:#e8e8e8; font-family:'DIN Next LT Arabic', Tahoma, Arial, sans-serif;">
    <table id="invite-card" role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#313131" width="560" style="width:100%; max-width:560px; margin:0 auto; border-collapse:collapse; table-layout:fixed; background-color:#313131;">
        <tr>
            <td colspan="2" bgcolor="#313131" style="padding:0; background-color:#313131; line-height:0; font-size:0;">
                <img src="assets/emailInvitation/emailInvite-v5/email-invite-header.webp" width="560" alt="Aramco" style="display:block; width:100%; height:auto; border:0;" />
            </td>
        </tr>
        <tr>
            <td colspan="2" class="name-cell" align="left" valign="middle" bgcolor="#313131" style="position:relative; height:0; padding:0 0 16.4276% 0; margin:0; background:#313131; background-color:#313131; background-image:none;">
                <span id="guestName" style="position:absolute; left:80px; top:50%; transform:translateY(-50%); display:block; margin:0; color:#ffffff; -webkit-text-fill-color:#ffffff; background:transparent; font-family:Arial, Helvetica, sans-serif; font-size:30px; font-weight:700; line-height:36px; text-align:left;">Dear Guest</span>
            </td>
        </tr>
        <tr>
            <td colspan="2" bgcolor="#313131" style="padding:0; background-color:#313131; line-height:0; font-size:0;">
                <img src="assets/emailInvitation/emailInvite-v5/email-invite-info.webp" width="560" alt="Farewell ceremony details" style="display:block; width:100%; height:auto; border:0;" />
            </td>
        </tr>
        <tr>
            <td width="280" bgcolor="#313131" style="padding:0; width:50%; background-color:#313131; line-height:0; font-size:0;">
                <a id="btnAccept" href="http://aramcocorporatevents.com/rsvp?status=accept&amp;uniqueId=" style="display:block; text-decoration:none;">
                    <img src="assets/emailInvitation/emailInvite-v5/email-invite-accept.webp" width="280" alt="Accept" style="display:block; width:100%; height:auto; border:0;" />
                </a>
            </td>
            <td width="280" bgcolor="#313131" style="padding:0; width:50%; background-color:#313131; line-height:0; font-size:0;">
                <a id="btnDecline" href="http://aramcocorporatevents.com/rsvp?status=decline&amp;uniqueId=" style="display:block; text-decoration:none;">
                    <img src="assets/emailInvitation/emailInvite-v5/email-invite-decline.webp" width="280" alt="Decline" style="display:block; width:100%; height:auto; border:0;" />
                </a>
            </td>
        </tr>
    </table>

    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var name = (params.get("name") || "").trim();
            var uniqueId = (params.get("uniqueId") || "").trim();

            var guestEl = document.getElementById("guestName");
            if (name && guestEl) guestEl.textContent = name;

            var RSVP_BASE = "http://aramcocorporatevents.com/rsvp";

            function buildUrl(statusValue) {
                var next = new URLSearchParams();
                if (name) next.set("name", name);
                if (uniqueId) next.set("uniqueId", uniqueId);
                next.set("status", statusValue);
                return RSVP_BASE + "?" + next.toString();
            }

            var accept = document.getElementById("btnAccept");
            var decline = document.getElementById("btnDecline");
            if (accept) accept.href = buildUrl("accept");
            if (decline) decline.href = buildUrl("decline");
        })();
    </script>
</body>

</html>

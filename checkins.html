<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Live check-ins</title>
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <style>
        *,
        *::before,
        *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0D1117;
            --surface: #161B22;
            --border: #30363D;
            --text: #E6EDF3;
            --text-muted: #8B949E;
            --accent: #2F81F7;
            --green: #3FB950;
            --radius: 14px;
        }

        body {
            font-family: Inter, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            color-scheme: dark;
        }

        .wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 64px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        h1 { font-size: 28px; font-weight: 700; }

        .links { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        a.btn, button.btn {
            display: inline-flex;
            align-items: center;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .status-line {
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .count {
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
        }

        .count span {
            display: block;
            margin-top: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .panel {
            margin-top: 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            max-height: calc(100vh - 230px);
            overflow: auto;
        }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: normal;
            vertical-align: top;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--surface);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }

        tr:last-child td { border-bottom: 0; }

        tr.is-in td { background: rgba(63, 185, 80, 0.08); }

        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-accepted { background: rgba(63, 185, 80, 0.16); color: var(--green); }
        .status-pending { background: rgba(210, 153, 34, 0.16); color: #D29922; }
        .status-declined { background: rgba(248, 81, 73, 0.16); color: #F85149; }

        .not-live {
            margin-top: 28px;
            padding: 36px 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            text-align: center;
        }

        .not-live h2 { font-size: 22px; margin-bottom: 8px; }

        .not-live p { color: var(--text-muted); font-size: 14px; }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(63, 185, 80, 0.16);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="header">
            <div>
                <div class="eyebrow" id="eyebrow">Invitation Management System</div>
                <h1>Live check-ins</h1>
            </div>
            <div class="links">
                <a class="btn" id="dashboardLink" href="dashboard.html">Dashboard</a>
                <button class="btn" type="button" onclick="refreshCheckins(true)">Refresh</button>
            </div>
        </div>
        <div id="notLive" class="not-live" hidden>
            <h2>The event is not live</h2>
            <p>Check-ins appear here after Go live on the dashboard.</p>
        </div>
        <div id="board">
        <div class="count" id="count">—<span id="countLabel">Checked in</span></div>
        <p class="status-line" id="statusLine">Loading…</p>
        <div class="panel">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Company</th>
                        <th>Position</th>
                        <th>Seat</th>
                        <th>Checked in</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
            <div class="empty" id="empty" hidden>No guests yet.</div>
        </div>
        </div>
    </div>
    <script>
        const baseURL = "https://udcwebapi2025-avdxdce9gngffkgx.uaenorth-01.azurewebsites.net";
        const eventApi = new URLSearchParams(location.search).has("cmc") ? "CapitalMarketConversation" : "AramcoFarewell";
        const liveStorageKey = eventApi === "CapitalMarketConversation" ? "cmcWentLiveOn" : "aramcoFarewellWentLiveOn";
        const cmc = eventApi === "CapitalMarketConversation";
        if (cmc) {
            document.getElementById("eyebrow").textContent = "Capital Markets Conversation";
            document.getElementById("dashboardLink").href = "dashboard.html?cmc=1";
        }

        let seatLabels = {};
        let refreshing = false;
        let refreshTimer = null;

        function parseInstant(value) {
            if (!value) return null;
            const raw = String(value).trim();
            const iso = /Z$|[+-]\d{2}:\d{2}$/.test(raw) ? raw : raw.replace(" ", "T") + "Z";
            const date = new Date(iso);
            return Number.isNaN(date.getTime()) ? null : date;
        }

        function formatViewerTime(value) {
            const date = value instanceof Date ? value : parseInstant(value);
            if (!date) return "";
            const options = {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                hour12: true,
                timeZoneName: "shortOffset"
            };
            try {
                return date.toLocaleString(undefined, options);
            } catch (e) {
                options.timeZoneName = "short";
                return date.toLocaleString(undefined, options);
            }
        }

        function escapeHtml(value) {
            return String(value || "").replace(/[&<>"']/g, ch => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[ch]));
        }

        async function readWentLive() {
            try {
                const res = await fetch(`${baseURL}/api/${eventApi}/event-live`, { cache: "no-store" });
                if (res.ok) {
                    const body = await res.json();
                    const value = body.wentLiveOn || body.WentLiveOn || null;
                    if (value) localStorage.setItem(liveStorageKey, value);
                    else localStorage.removeItem(liveStorageKey);
                    return value;
                }
            } catch (e) {}
            return localStorage.getItem(liveStorageKey);
        }

        function rowFaceCode(value) {
            const text = String(value || "").trim();
            const match = /-\s*([A-Z]+\d+)$/i.exec(text);
            return match ? match[1].toUpperCase() : text;
        }

        function indexSeatPlan(doc) {
            seatLabels = {};
            if (!doc || !doc.layouts || !doc.layouts.length) return;
            let layout = doc.layouts[0];
            for (let i = 0; i < doc.layouts.length; i++) {
                if (doc.layouts[i].id === doc.activeLayoutId) layout = doc.layouts[i];
            }
            const objects = layout.objects || [];
            const tables = {};
            const byTable = {};
            objects.forEach(obj => {
                if (obj.type === "table") tables[obj.id] = obj;
                if (obj.type === "chair" && obj.tableId) {
                    if (!byTable[obj.tableId]) byTable[obj.tableId] = [];
                    byTable[obj.tableId].push(obj);
                }
            });
            Object.keys(byTable).forEach(tableId => {
                const chairs = byTable[tableId].sort((a, b) => (a.slot || 0) - (b.slot || 0));
                const table = tables[tableId];
                const number = table ? parseInt(table.tableNo, 10) : 0;
                const tableText = number ? ("Table " + number) : ((table && table.label) || "Table");
                chairs.forEach((chair, index) => {
                    const stored = String(chair.seatNumber || "").trim().toUpperCase();
                    if (!stored) return;
                    if (table && table.shape === "rows") {
                        seatLabels[stored] = rowFaceCode(chair.seatNumber);
                        return;
                    }
                    seatLabels[stored] = tableText + " - C-" + String(index + 1).padStart(3, "0");
                });
            });
        }

        async function loadSeatPlan() {
            try {
                const res = await fetch(`${baseURL}/api/${eventApi}/seats/map`, { cache: "no-store" });
                if (!res.ok) return;
                const svgText = await res.text();
                if (!svgText || svgText.indexOf("<svg") === -1) return;
                const xml = new DOMParser().parseFromString(svgText, "image/svg+xml");
                const meta = xml.querySelector("[id='aramco-seat-layout']");
                if (!meta || !meta.textContent) return;
                const data = JSON.parse(meta.textContent);
                if (data && data.version === 2) indexSeatPlan(data);
            } catch (e) {}
        }

        function seatLabel(code) {
            const key = String(code || "").trim().toUpperCase();
            if (!key) return "—";
            return seatLabels[key] || String(code).trim();
        }

        function guestStatus(user) {
            const raw = String(user.status || user.Status || "pending").trim().toLowerCase();
            if (raw === "accept" || raw === "accepted") return "accepted";
            if (raw === "decline" || raw === "declined" || raw === "declain") return "declined";
            return "pending";
        }

        function arrivalAfter(user, liveAt) {
            if (!liveAt) return null;
            const stamps = (user.checkIns || user.CheckIns || [])
                .map(item => parseInstant(item && (item.checkedInOn || item.CheckedInOn)))
                .filter(date => date && date.getTime() >= liveAt.getTime())
                .sort((a, b) => b - a);
            return stamps[0] || null;
        }

        function renderRows(guests) {
            const body = document.getElementById("rows");
            const empty = document.getElementById("empty");
            const checkedIn = guests.filter(guest => guest.arrived).length;
            document.getElementById("count").firstChild.textContent = String(checkedIn);
            document.getElementById("countLabel").textContent = `Checked in · ${guests.length} guest${guests.length === 1 ? "" : "s"}`;
            if (!guests.length) {
                body.innerHTML = "";
                empty.hidden = false;
                empty.textContent = "No guests yet.";
                return;
            }
            empty.hidden = true;
            body.innerHTML = guests.map(guest => `
                <tr class="${guest.arrived ? "is-in" : ""}">
                    <td>${escapeHtml(guest.name)}</td>
                    <td><span class="status status-${guest.status}">${escapeHtml(guest.statusLabel)}</span></td>
                    <td>${escapeHtml(guest.company || "—")}</td>
                    <td>${escapeHtml(guest.position || "—")}</td>
                    <td>${escapeHtml(guest.seat)}</td>
                    <td>${guest.arrived ? escapeHtml(formatViewerTime(guest.arrived)) : "—"}</td>
                </tr>`).join("");
        }

        async function refreshCheckins(manual) {
            if (refreshing) return;
            refreshing = true;
            const status = document.getElementById("statusLine");
            try {
                const wentLive = await readWentLive();
                const liveAt = parseInstant(wentLive);
                const board = document.getElementById("board");
                const notLive = document.getElementById("notLive");
                if (!liveAt) {
                    board.hidden = true;
                    notLive.hidden = false;
                    status.textContent = "";
                    return;
                }
                notLive.hidden = true;
                board.hidden = false;
                const res = await fetch(`${baseURL}/api/${eventApi}/users`, { cache: "no-store" });
                if (!res.ok) throw new Error("Could not load guests");
                const data = (await res.json()) || [];
                const labels = { accepted: "Accepted", pending: "Pending", declined: "Declined" };
                const guests = data.map(user => {
                    const statusKey = guestStatus(user);
                    const seatCode = user.seatCode || user.SeatCode || "";
                    return {
                        name: user.fullName || user.FullName || "Guest",
                        status: statusKey,
                        statusLabel: labels[statusKey],
                        company: user.company || user.Company || "",
                        position: user.position || user.Position || "",
                        seat: seatLabel(seatCode),
                        arrived: arrivalAfter(user, liveAt)
                    };
                }).sort((a, b) => {
                    if (a.arrived && b.arrived) return b.arrived - a.arrived;
                    if (a.arrived) return -1;
                    if (b.arrived) return 1;
                    return a.name.localeCompare(b.name);
                });
                renderRows(guests);
                const updated = `updated ${escapeHtml(formatViewerTime(new Date()))} · refreshes every 30 seconds`;
                status.innerHTML = `<span class="live-dot"></span>Live since ${escapeHtml(formatViewerTime(liveAt))} · ${updated}`;
            } catch (e) {
                status.textContent = manual ? (e.message || "Update failed") : "Update failed · refreshes every 30 seconds";
            } finally {
                refreshing = false;
            }
        }

        function armRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(() => {
                if (document.hidden) return;
                refreshCheckins(false);
            }, 30000);
        }

        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) refreshCheckins(false);
        });

        loadSeatPlan().then(() => refreshCheckins(false));
        armRefresh();
    </script>
</body>

</html>

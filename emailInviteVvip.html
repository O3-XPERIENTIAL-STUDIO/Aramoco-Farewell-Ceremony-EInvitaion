<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="assets/css/manifa.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light" />
    <title>دعوة رسمية VVIP | أرامكو</title>
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <link rel="apple-touch-icon" href="assets/icon.png" />
    <!--[if mso]>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->

    <style>

:root {
            color-scheme: light only;
            supported-color-schemes: light;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background: #e8e8e8;
            font-family: "Manifa Pro", Tahoma, Arial, sans-serif;
            color-scheme: light only;
        }

        table {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            border-collapse: collapse;
            table-layout: fixed;
            background: #ffffff;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        td {
            padding: 0;
            text-align: center;
            vertical-align: top;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            border: 0;
        }

        a {
            display: block;
            text-decoration: none;
        }

        .name-cell,
        #guestName {
            background: #ffffff !important;
            background-color: #ffffff !important;
            background-image: linear-gradient(#ffffff, #ffffff) !important;
            color: #26235A !important;
            -webkit-text-fill-color: #26235A !important;
            font-family: "Manifa Pro", Tahoma, Arial, sans-serif !important;
            font-weight: 500 !important;
        }

        .name-cell {
            padding: 0 20px !important;
            font-size: 20px !important;
            font-weight: 500 !important;
            line-height: 24px !important;
            color-scheme: light only;
        }

        #guestName {
            display: inline-block !important;
            width: 100% !important;
        }

        .confirm-prompt-cell {
            padding: 28px 24px 20px !important;
            font-size: 18px !important;
            font-weight: 700 !important;
            line-height: 1.6 !important;
            color: #26235A !important;
            background: #ffffff !important;
        }

        @media (prefers-color-scheme: dark) {

            .name-cell,
            #guestName {
                background: #ffffff !important;
                background-color: #ffffff !important;
                background-image: linear-gradient(#ffffff, #ffffff) !important;
                color: #26235A !important;
                -webkit-text-fill-color: #26235A !important;
            }
        }

        [data-ogsc] .name-cell,
        [data-ogsc] #guestName,
        [data-ogsb] .name-cell,
        [data-ogsb] #guestName {
            background: #ffffff !important;
            background-color: #ffffff !important;
            background-image: linear-gradient(#ffffff, #ffffff) !important;
            color: #26235A !important;
        }

        @media (max-width: 620px) {
            body {
                padding: 0;
            }

            .name-cell {
                padding: 0 14px !important;
                font-size: 18px !important;
            }

            .confirm-prompt-cell {
                padding: 22px 16px 16px !important;
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body class="body" style="margin:0; padding:24px 16px; background:#e8e8e8; font-family:'Manifa Pro', Tahoma, Arial, sans-serif;">
    <table id="invite-card" role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" width="560" style="width:100%; max-width:560px; margin:0 auto; border-collapse:collapse; table-layout:fixed; background-color:#ffffff;">
        <!-- VVIP full invite body image -->
        <tr>
            <td colspan="2" bgcolor="#ffffff" style="padding:0; background-color:#ffffff; line-height:0; font-size:0;">
                <img id="vvipBodyImage" src="assets/emailInvitation/emailInvite-vvip/email-invite-vvip-body.jpg?v=2" width="560" alt="دعوة أرامكو VVIP" style="display:block; width:100%; height:auto; border:0;" />
            </td>
        </tr>
    </table>

    <!-- empty space (page background, no white strip) -->
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" bgcolor="#e8e8e8" style="width:100%; max-width:560px; margin:0 auto; border-collapse:collapse; background-color:#e8e8e8;">
        <tr>
            <td height="8" bgcolor="#e8e8e8" style="height:8px; line-height:8px; font-size:0; background-color:#e8e8e8;">&nbsp;</td>
        </tr>
    </table>

    <table id="invite-footer" role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" width="560" style="width:100%; max-width:560px; margin:0 auto; border-collapse:collapse; table-layout:fixed; background-color:#ffffff;">
        <!-- guest name (hidden for now — uncomment to show)
        <tr>
            <td colspan="2" class="name-cell" align="center" valign="middle" bgcolor="#ffffff" style="padding:0 20px; margin:0; background:#ffffff; background-color:#ffffff; background-image:linear-gradient(#ffffff,#ffffff); color:#26235A; font-family:'Manifa Pro', Tahoma, Arial, sans-serif; font-size:20px; font-weight:500; line-height:24px; text-align:center;">
                <span id="guestName" style="display:inline-block; width:100%; color:#26235A; -webkit-text-fill-color:#26235A; background:#ffffff; background-color:#ffffff; background-image:linear-gradient(#ffffff,#ffffff); font-family:'Manifa Pro', Tahoma, Arial, sans-serif; font-weight:500;">ضيفنا الكريم</span>
            </td>
        </tr>
        -->

        <!-- spacing + confirmation prompt above Accept/Decline -->
        <tr>
            <td colspan="2" class="confirm-prompt-cell" dir="ltr" align="center" valign="middle" bgcolor="#ffffff" style="padding:28px 24px 20px; margin:0; background:#ffffff; background-color:#ffffff; color:#26235A; font-family:'Manifa Pro', Tahoma, Arial, sans-serif; font-size:18px; font-weight:700; line-height:1.6; text-align:center; direction:ltr;">
                نأمل التكرم بتأكيد حضوركم
            </td>
        </tr>

        <!-- Force LTR on CTA row so order never swaps: Decline (left) → Accept (right) -->
        <tr>
            <td colspan="2" dir="ltr" bgcolor="#ffffff" style="padding:0; background-color:#ffffff; direction:ltr; text-align:left; line-height:0; font-size:0;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" dir="ltr" width="560" bgcolor="#ffffff" style="width:100%; max-width:560px; border-collapse:collapse; table-layout:fixed; direction:ltr; background-color:#ffffff;">
                    <tr>
                        <td dir="ltr" width="280" bgcolor="#ffffff" style="padding:0; width:50%; background-color:#ffffff; direction:ltr; line-height:0; font-size:0;">
                            <a id="btnDecline" href="http://aramcocorporatevents.com/rsvp?status=decline&amp;uniqueId=" style="display:block; text-decoration:none;">
                                <img src="assets/emailInvitation/emailInvite-vvip/email-invite-decline.webp" width="280" alt="اعتذار" style="display:block; width:100%; height:auto; border:0;" />
                            </a>
                        </td>
                        <td dir="ltr" width="280" bgcolor="#ffffff" style="padding:0; width:50%; background-color:#ffffff; direction:ltr; line-height:0; font-size:0;">
                            <a id="btnAccept" href="http://aramcocorporatevents.com/rsvp?status=accept&amp;uniqueId=" style="display:block; text-decoration:none;">
                                <img src="assets/emailInvitation/emailInvite-vvip/email-invite-accept.webp" width="280" alt="تأكيد الحضور" style="display:block; width:100%; height:auto; border:0;" />
                            </a>
                        </td>

                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var name = (params.get("name") || "").trim();
            var uniqueId = (params.get("uniqueId") || "").trim();

            var guestEl = document.getElementById("guestName");
            if (name && guestEl) guestEl.textContent = name;

            var RSVP_BASE = "http://aramcocorporatevents.com/rsvp";

            function buildUrl(statusValue) {
                var next = new URLSearchParams();
                if (name) next.set("name", name);
                if (uniqueId) next.set("uniqueId", uniqueId);
                next.set("status", statusValue);
                return RSVP_BASE + "?" + next.toString();
            }

            var accept = document.getElementById("btnAccept");
            var decline = document.getElementById("btnDecline");
            if (accept) accept.href = buildUrl("accept");
            if (decline) decline.href = buildUrl("decline");

            var bodyImg = document.getElementById("vvipBodyImage");
            var defaultBody = "assets/emailInvitation/emailInvite-vvip/email-invite-vvip-body.jpg?v=2";
            if (bodyImg && uniqueId) {
                var apiBase = "https://udcwebapi2025-avdxdce9gngffkgx.uaenorth-01.azurewebsites.net";
                bodyImg.onerror = function() {
                    bodyImg.onerror = null;
                    bodyImg.src = defaultBody;
                };
                bodyImg.src = apiBase + "/api/AramcoFarewell/vvip-body/" + encodeURIComponent(uniqueId);
            }
        })();
    </script>
</body>

</html>
